<body class="text-white bg-dark d-flex flex-column min-vh-100">

    <!-- fixed navbar-->

          aria-label="Toggle navigation">
          Menu
          <i class="fas fa-bars"></i>
        </button>

        <!-- container for responsive, wraps the elements into a menu-->

              <a class="nav-link" href="detalle.html">Car-Detail</a>

<!--Aside content-->
  <aside class="container px-4 px-lg-5 mt-5 pt-5">
    <div class="position-relative">
      <img src="assets/img/coche_fondoOscuro.jpg" class="img-fluid rounded-3" alt="" id="carBg">
      <div class="position-absolute top-50 start-50 translate-middle w-75">
        <div class="text-center text-white">
          <h1 class="mx-auto my-0 text-uppercase" id="titleCreate">BRAND CREATOR</h1>
          <h4 class="mx-auto my-0">Create any brand.</h4>
        </div>
      </div>
    </div>
  </aside>

  <!--Main content-->
  <main class="container px-4 px-lg-5 my-5 flex-grow-1">

    <section>
      <div
        class="container fw-bold text-capitalize bg-dark d-flex border border-secondary  justify-content-center align-items-center rounded-4 shadow p-5  text-center"" id="
        bannerCreate">
        <h2 class="m-0">Create your brand here</h2>
      </div>
      <div class="container bg-dark border border-secondary rounded-4 shadow p-4 p-md-5 mt-5" id="formulario">

        <form action="" id="formCreator">
          <div class="row g-3 mt-1">
            <div class="col-12 col-md-6" id="brandDiv">
              <div class="mb-3">
                <input type="text" class="form-control" id="brand" placeholder="Name of brand">
              </div>
            </div>
            <div class="col-12 col-md-6" id="yearDiv">
              <div class="mb-3">
                <input type="text" class="form-control" id="year" placeholder="Year of foundation">
              </div>
            </div>
          </div>

          <div class="row g-3 mt-1">
            <div class="col-12 col-md-6" id="countryDiv">
              <div class="mb-3">
                <input type="text" class="form-control" id="country" placeholder="Country">
              </div>
            </div>
            <div class="col-12 col-md-6" id="ratingDiv">
              <div class="mb-3">
                <input type="text" class="form-control" id="rating" placeholder="Rating">
              </div>
            </div>
          </div>

          <div class="row g-3 mt-1">
            <div class="col-12 col-md-6" id="imageDiv">
              <div class="mb-3">
                <input type="file" class="form-control" id="imageFile">
              </div>
            </div>
            <div class="col-12 col-md-6" id="segmentDiv">
              <div class="mb-3">
                <select class="form-select" id="segment">
                  <option selected disabled>Choose the segment</option>
                  <option value="lowCost">LOW-COST</option>
                  <option value="midRange">Mid-range</option>
                  <option value="luxury">Luxury</option>
                </select>
              </div>
            </div>
          </div>

          <div class="row g-3 mt-3 mb-3">
            <div class="col-12 d-flex justify-content-end gap-2">
              <a href="index.html" class="btn btn-secondary" id="cancel">CANCEL</a>
              <button type="submit" class="btn btn-primary" id="send">CREATE</button>
            </div>
          </div>
        </form>

      </div>
    </section>

  </main>
<!--end of main and header-->

                  <path

                carx@carx.com</a></li>

        <div class="col-lg-4">
          <h6 class="text-uppercase small fw-bold mb-3">Quick links</h6>
          <div class="row">
            <div class="col-6">
              <ul class="list-unstyled small">
                <li class="mb-2"><a class="link-secondary text-decoration-none" href="#page-top">Home</a></li>
