<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
  <meta name="description" content="" />
  <meta name="author" content="" />
  <title>Webapp14</title>
  <link rel="icon" type="image/x-icon" href="assets/favicon.ico" />
  <!-- Font Awesome icons (free version)-->
  <script src="https://use.fontawesome.com/releases/v6.3.0/js/all.js" crossorigin="anonymous"></script>
  <!-- Google fonts-->
  <link href="https://fonts.googleapis.com/css?family=Varela+Round" rel="stylesheet" />
  <link
    href="https://fonts.googleapis.com/css?family=Nunito:200,200i,300,300i,400,400i,600,600i,700,700i,800,800i,900,900i"
    rel="stylesheet" />
  <!-- Core theme CSS (includes Bootstrap)-->
  <link href="css/styles.css" rel="stylesheet" />
  <link href="css/global.css" rel="stylesheet" />
</head>

<body id="page-top">


  <!-- fixed navbar-->
  {{> navbar}}

  <!--Landing page-->
  <section class="masthead">

    <!-- main container that centers elements-->
    <div class="container-fluid px-4 px-lg-5 d-flex flex-column h-100 align-items-center justify-content-center"
      style="background: url('/uploads/img/bg-porsche.jpeg') no-repeat center center; background-size: cover;">
      <h1 class="text-uppercase">CarX</h1>
      <p class="paragraph">
        Welcome to CarX! Your Next Car Starts Here.
      </p>
      <!--link that redirects to brands section-->
      <a class="btn btn-primary" href="#cars">See Vehicules</a>
    </div>
  </section>
  <!--End of header-->
  </header>

  <!-- Main content-->
  <main>

    <!-- brands section-->
    <section class="bg-dark py-5" id="cars">
      <div class="container px-4 px-lg-5 mb-4">
        <div id="bannerCreate" class="bg-white border border-secondary rounded-4 shadow h-auto p-3 p-md-4">
          <div class="row">
            <form class="col-12 text-center" method="get" action="/search">
              <!-- Contenedor para los select en una sola fila sin wrap -->
              <div class="d-flex flex-row flex-nowrap gap-3 overflow-auto w-100 mb-3">
                <select class="btn btn-outline-info border-2 py-3 fw-semibold text-center flex-fill" id="country"
                  name="filter-country">
                  <option selected disabled>COUNTRY</option>
                  {{#uniqueCountries}}
                  <option value="{{.}}">{{.}}</option>
                  {{/uniqueCountries}}
                  <option value="italy">Italy</option>
                  <option value="japan">Japan</option>
                  <option value="romania">Romania</option>
                  <option value="usa">USA</option>
                </select>
                <select class="btn btn-outline-info border-2 py-3 fw-semibold flex-fill" id="rating"
                  name="filter-rating">
                  <option selected disabled>RATING</option>
                  <option value="1">1</option>
                  <option value="2">2</option>
                  <option value="3">3</option>
                  <option value="4">4</option>
                  <option value="5">5</option>
                </select>

                <select class="btn btn-outline-info border-2 py-3 fw-semibold flex-fill" id="segment"
                  name="filter-segment">
                  <option selected disabled>SEGMENT</option>
                  <option value="low-cost">Low-Cost</option>
                  <option value="mid-range">Mid-Range</option>
                  <option value="luxury">Luxury</option>
                </select>
              </div>

              <!-- Botón de búsqueda en otra fila -->
              <div class="w-100">
                <button type="submit" class="btn btn-info px-5 py-2 fw-semibold">Buscar</button>
              </div>
            </form>
          </div>
        </div>
      </div>
      <div class="container px-4 px-lg-5">
        <!-- create brand button -->
        <div class="d-flex justify-content-end mb-4">
          <a href="/createElement" class="btn btn-success">
            <i class="fas fa-plus me-2"></i>Create new brand
          </a>
        </div>

          <!-- main container that groups each element.-->
          <div class="row g-4 justify-content-center">
            <!-- We are repeating the same code about each brand card...-->
            <!-- Brand 1 card-->
            {{#brandCars}}
            <div class="col-12 col-sm-6 col-lg-4">
              <div class="card h-100 text-center border-0 shadow-sm py-4">
                <div class="card-body">
                  <img
                    src="/uploads/logos/{{img}}"
                    alt="{{name}}"
                    width="48"
                    height="48"
                    class="mb-3"
                  />
                  <h3 class="h5">{{name}}</h3>
                  <!-- Fíjate que ahora es /detalle/{{id_}} en vez de /detalle?id={{id_}} -->
                  <a class="btn btn-primary mt-2" href="/detalle/{{_id}}">See Vehicles</a>
                </div>
              </div>
            </div>
            {{/brandCars}}
          </div>

          {{>pages}}
        </div>
      </section>
    </main>
    <!-- End of section and main-->

    <!-- footer-->
    {{> footer}}

    <!-- Bootstrap core JS-->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
