<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
  <meta name="description" content="" />
  <meta name="author" content="" />
  <title>Grayscale - Start Bootstrap Theme</title>
  <link rel="icon" type="image/x-icon" href="assets/favicon.ico" />
  <!-- Font Awesome icons (free version)-->
  <script src="https://use.fontawesome.com/releases/v6.3.0/js/all.js" crossorigin="anonymous"></script>
  <!-- Google fonts-->
  <link href="https://fonts.googleapis.com/css?family=Varela+Round" rel="stylesheet" />
  <link
    href="https://fonts.googleapis.com/css?family=Nunito:200,200i,300,300i,400,400i,600,600i,700,700i,800,800i,900,900i"
    rel="stylesheet" />
  <!-- Core theme CSS (includes Bootstrap)-->
  <link href="css/styles.css" rel="stylesheet" />
  <link href="css/global.css" rel="stylesheet" />
</head>

<body id="page-top">

  <!-- Semantically, header includes navbar and landing page section-->
  <header>

    <!-- fixed navbar-->
         {{> navbar}}

  </header>
  <!--Landing page-->
  <section class="masthead">

    <!-- main container that centers elements-->
    <div class="container px-4 px-lg-5 d-flex flex-column h-100 align-items-center justify-content-center">
      <h1 class="text-uppercase">CarX</h1>
      <p class="paragraph">
        Welcome to CarX! Your Next Car Starts Here.
      </p>

      <!--link that redirects to brands section-->
      <a class="btn btn-primary" href="#cars">See Vehicules</a>
    </div>
  </section>
  <!--End of header-->
  </header>

  <!-- Main content-->
  <main>

    <!-- brands section-->
    <section class="bg-dark py-5" id="cars">
      <div class="container px-4 px-lg-5 mb-4">
        <div id="bannerCreate" class="bg-white border border-secondary rounded-4 shadow h-auto p-3 p-md-4">
          <div class="row row-cols-2 row-cols-md-4 g-3 g-md-4">
            <div class="col">
              <button type="button" class="btn btn-outline-info border-2 w-100 py-3 fw-semibold">Country</button>
            </div>
            <div class="col">
              <button type="button" class="btn btn-outline-info border-2 w-100 py-3 fw-semibold">Rating</button>
            </div>
            <div class="col">
              <button type="button" class="btn btn-outline-info border-2 w-100 py-3 fw-semibold">Year</button>
            </div>
            <div class="col">
              <button type="button" class="btn btn-outline-info border-2 w-100 py-3 fw-semibold">Segment</button>
            </div>
          </div>
        </div>
      </div>
      <div class="container px-4 px-lg-5">
        <!-- create brand button -->
        <div class="d-flex justify-content-end mb-4">
          <a href="/createElement" class="btn btn-success">
            <i class="fas fa-plus me-2"></i>Create new brand
          </a>
        </div>

        <!-- main container that groups each element.-->
        <div class="row g-4 justify-content-center">

          <!-- We are repeating the same code about each brand card...-->
          <!-- Brand 1 card-->
           {{#cars}}
           {{#brands}}
          <div class="col-12 col-sm-6 col-lg-4">
            <div class="card h-100 text-center border-0 shadow-sm py-4">
              <div class="card-body">
                <img src="assets/logos/ferrari.svg" alt="{{name}}" width="48" height="48" class="mb-3" />
                <h3 class="h5">{{name}}</h3>
                <a class="btn btn-primary mt-2" href="detalle?marca={{name}}">See Vehicles</a>
              </div>
            </div>
          </div>
          {{/brands}}
          {{/cars}}
        </div>
      </div>
    </section>
  </main>
  <!-- End of section and main-->


  <!-- footer-->
  {{> footer}}

  <!-- Bootstrap core JS-->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
