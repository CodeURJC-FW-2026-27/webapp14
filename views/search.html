<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resultados de Búsqueda</title>
    <!-- Bootstrap CSS para mantener el estilo -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container py-5">

    <h1 class="text-center mb-4">Resultados de la Búsqueda</h1>

    <!-- Botón para volver al inicio -->
    <div class="mb-4 text-center">
        <a href="/" class="btn btn-secondary">Volver al Inicio</a>
    </div>

    <!-- Mensaje de error si no hay elementos (Mustache evalúa si 'error' existe/tiene valor) -->
    {{#error}}
      <div class="alert alert-warning text-center" role="alert">
        {{error}}
      </div>
    {{/error}}

    <!-- Listado de resultados (Mustache itera sobre el array 'brandCars') -->
    <div class="row row-cols-1 row-cols-md-3 g-4">
      {{#brandCars}}
        <div class="col">
          <div class="card h-100 shadow-sm text-center p-3">
            {{#img}}
              <img src="/uploads/logos/{{img}}" class="card-img-top mx-auto" style="height: 100px; width: auto; object-fit: contain;" alt="{{name}}">
            {{/img}}
            <div class="card-body">
              <h5 class="card-title text-uppercase fw-bold">{{name}}</h5>
              <p class="card-text mb-1"><strong>País:</strong> {{country}}</p>
              <p class="card-text mb-1"><strong>Año:</strong> {{year}}</p>
              <p class="card-text mb-1"><strong>Rating:</strong> {{rating}}</p>
              <p class="card-text"><strong>Segmento:</strong> {{segment}}</p>
                <a class="btn btn-primary mt-2" href="/detalle?name={{name}}">See Vehicles</a>

            </div>
          </div>
        </div>
      {{/brandCars}}
    </div>

</body>
</html>
