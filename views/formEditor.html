<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
  <meta name="description" content="" />
  <meta name="author" content="" />
  <title>Creator of brands</title>
  <link rel="icon" type="image/x-icon" href="assets/favicon.ico" />
  <!-- Font Awesome icons (free version)-->
  <script src="https://use.fontawesome.com/releases/v6.3.0/js/all.js" crossorigin="anonymous"></script>
  <!-- Google fonts-->
  <link href="https://fonts.googleapis.com/css?family=Varela+Round" rel="stylesheet" />
  <link
    href="https://fonts.googleapis.com/css?family=Nunito:200,200i,300,300i,400,400i,600,600i,700,700i,800,800i,900,900i"
    rel="stylesheet" />
  <!-- Core theme CSS (includes Bootstrap)-->
  <link href="/css/styles.css" rel="stylesheet" />
  <link href="/css/global.css" rel="stylesheet" />
  <link rel="stylesheet" href="/css/createEleStyles.css">
</head>

<body class="text-white bg-dark d-flex flex-column min-vh-100">
    <!-- fixed navbar-->
      {{> navbar}}
    </header>

        <div class="text-center text-white">
          <h1 class="mx-auto my-0 text-uppercase">Brand Editor</h1>
        </div>


  <!--Main content-->
  <main class="container px-4 px-lg-5 my-5 flex-grow-1">

    <section>
      <div class="container bg-dark border border-secondary rounded-4 shadow p-4 p-md-5 mt-5" id="formulario">

        <!-- 1. El action ahora apunta a la ruta de edición con el id -->
        <form action="/detalle/{{id}}/edit" id="formCreator" enctype="multipart/form-data" method="post">
       
          <div class="row g-3 mt-1">
            <div class="col-12 col-md-6" id="brandDiv">
              <div class="mb-3">
                <label class="form-label text-white small text-uppercase fw-bold mb-2">Brand Name</label>
                <!-- 2. Añadido value="{{name}}" -->
                <input type="text" class="form-control" id="brand" placeholder="Name of brand" name="bName" value="{{name}}">
              </div>
            </div>
            <div class="col-12 col-md-6" id="yearDiv">
              <div class="mb-3">
                <label class="form-label text-white small text-uppercase fw-bold mb-2">Year of Foundation</label>
                <!-- 3. Añadido value="{{year}}" -->
                <input type="text" class="form-control" id="year" placeholder="Year of foundation" name="bYear" value="{{year}}">
              </div>
            </div>
          </div>

          <div class="row g-3 mt-1">
            <div class="col-12 col-md-6" id="countryDiv">
              <div class="mb-3">
                <label class="form-label text-white small text-uppercase fw-bold mb-2">Country</label>
                <!-- 4. Añadido value="{{country}}" -->
                <input type="text" class="form-control" id="country" placeholder="Country" name="bCountry" value="{{country}}">
              </div>
            </div>
            <div class="col-12 col-md-6" id="ratingDiv">
              <div class="mb-3 d-flex flex-column justify-content-center">
                <label class="form-label text-white small text-uppercase fw-bold mb-2">Rating</label>
                <div class="d-flex flex-wrap align-items-center justify-content-between gap-2 px-3 py-2 bg-black bg-opacity-25 rounded border border-secondary">
                  
                  <!-- 5. Añadidas las banderas {{#rateX}}checked{{/rateX}} para marcar el radio button correcto -->
                  <div class="form-check m-0">
                    <input class="form-check-input" type="radio" name="stars" id="rate1" value="1" {{#rate1}}checked{{/rate1}}>
                    <label class="form-check-label text-white fw-bold" for="rate1">1</label>
                  </div>
                  <div class="form-check m-0">
                    <input class="form-check-input" type="radio" name="stars" id="rate2" value="2" {{#rate2}}checked{{/rate2}}>
                    <label class="form-check-label text-white fw-bold" for="rate2">2</label>
                  </div>
                  <div class="form-check m-0">
                    <input class="form-check-input" type="radio" name="stars" id="rate3" value="3" {{#rate3}}checked{{/rate3}}>
                    <label class="form-check-label text-white fw-bold" for="rate3">3</label>
                  </div>
                  <div class="form-check m-0">
                    <input class="form-check-input" type="radio" name="stars" id="rate4" value="4" {{#rate4}}checked{{/rate4}}>
                    <label class="form-check-label text-white fw-bold" for="rate4">4</label>
                  </div>
                  <div class="form-check m-0">
                    <input class="form-check-input" type="radio" name="stars" id="rate5" value="5" {{#rate5}}checked{{/rate5}}>
                    <label class="form-check-label text-white fw-bold" for="rate5">5</label>
                  </div>

                </div>
              </div>
            </div>
          </div>

         <div class="row g-3 mt-1">
            <div class="col-12" id="descriptionDiv">
              <div class="mb-3">
                <label class="form-label text-white small text-uppercase fw-bold mb-2">Description</label>
                <!-- 6. El texto actual va dentro del textarea -->
                <textarea class="form-control" id="description" rows="3" placeholder="Enter brand description" name="bDescription">{{description}}</textarea>
              </div>
            </div>
          </div>
          
          <div class="row g-3 mt-1">
            <div class="col-12 col-md-6" id="imageDiv">
              <div class="mb-3">
                <!-- 7. Opcional: mostrar imagen actual si existe -->
                {{#img}}
                  <div class="mb-2">
                    <img src="/uploads/{{img}}" alt="Current image" width="70" class="rounded border border-secondary">
                    <small class="text-muted d-block">Current image (upload new to replace)</small>
                  </div>
                {{/img}}
                <label class="form-label text-white small text-uppercase fw-bold mb-2">Image</label>
                <input type="file" class="form-control" id="imageFile" name="bImage">
              </div>
            </div>
            
            <div class="col-12 col-md-6" id="segmentDiv">
              <div class="mb-3">
                <label class="form-label text-white small text-uppercase fw-bold mb-2">Segment</label>
                <!-- 8. Añadidas las banderas {{#isSegment}}selected{{/isSegment}} -->
                <select class="form-select" name="segment" id="segment">
                  <option disabled value="">Choose the segment</option>
                  <option value="lowCost" {{#isLowCost}}selected{{/isLowCost}}>Low-cost</option>
                  <option value="midRange" {{#isMidRange}}selected{{/isMidRange}}>Mid-range</option>
                  <option value="luxury" {{#isLuxury}}selected{{/isLuxury}}>Luxury</option>
                </select>
              </div>
            </div>
          </div>

      
          <div class="row g-3 mt-3 mb-3">
            <div class="col-12 d-flex justify-content-end gap-2">
              <!-- 9. Botón cancelar redirige de vuelta al detalle de ese elemento -->
              <a href="/detalle/{{id}}" class="btn btn-secondary" id="cancel">CANCEL</a>
              <button type="submit" class="btn btn-primary" id="send">SAVE CHANGES</button>
            </div>
          </div>
        </form>

      </div>
    </section>

  </main>

    
    {{> footer}}
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
