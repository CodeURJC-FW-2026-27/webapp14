<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Brand - CarX</title>
    <script src="https://use.fontawesome.com/releases/v6.3.0/js/all.js" crossorigin="anonymous"></script>
    <link href="https://fonts.googleapis.com/css?family=Varela+Round" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css?family=Nunito:200,200i,300,300i,400,400i,600,600i,700,700i,800,800i,900,900i" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/styles.css" rel="stylesheet" />
    <link href="/css/global.css" rel="stylesheet" />
</head>
<body class="text-white bg-dark d-flex flex-column min-vh-100">
    <header>
      {{> navbar}}
    </header>

    <main class="container px-4 px-lg-5 my-5 flex-grow-1 pt-5">
      <div class="container fw-bold text-capitalize bg-dark d-flex border border-secondary justify-content-center align-items-center rounded-4 shadow p-4 text-center mb-4">
        <h2 class="m-0">Edit Brand: {{name}}</h2>
      </div>

      <div class="container bg-dark border border-secondary rounded-4 shadow p-4 p-md-5">
        <form action="/detalle/{{id}}/edit" method="POST" enctype="multipart/form-data">
          
          <div class="mb-3">
            <label class="form-label text-white small text-uppercase fw-bold">Brand Name</label>
            <input type="text" class="form-control" name="bName" value="{{name}}" required>
          </div>

          <div class="mb-3">
            <label class="form-label text-white small text-uppercase fw-bold">Country</label>
            <input type="text" class="form-control" name="bCountry" value="{{country}}" required>
          </div>

          <div class="mb-3">
            <label class="form-label text-white small text-uppercase fw-bold">Year of Foundation</label>
            <input type="text" class="form-control" name="bYear" value="{{year}}" required>
          </div>

          <div class="mb-3">
            <label class="form-label text-white small text-uppercase fw-bold">Rating</label>
            <input type="text" class="form-control" name="stars" value="{{rating}}" required>
          </div>

          <div class="mb-3">
            <label class="form-label text-white small text-uppercase fw-bold">Description</label>
            <textarea class="form-control" name="bDescription" rows="3" required>{{description}}</textarea>
          </div>

          <div class="mb-3">
            <label class="form-label text-white small text-uppercase fw-bold">Segment</label>
            <select class="form-select" name="segment" required>
              <option value="low-cost" {{#if (eq segment "low-cost")}}selected{{/if}}>Low-cost</option>
              <option value="mid-range" {{#if (eq segment "mid-range")}}selected{{/if}}>Mid-range</option>
              <option value="luxury" {{#if (eq segment "luxury")}}selected{{/if}}>Luxury</option>
            </select>
          </div>

          <div class="mb-3">
            <label class="form-label text-white small text-uppercase fw-bold">New Image (Optional)</label>
            <input type="file" class="form-control" name="bImage">
          </div>

          <div class="d-flex justify-content-end gap-2 mt-4">
            <a href="/detalle/{{id}}" class="btn btn-secondary">CANCEL</a>
            <button type="submit" class="btn btn-primary">SAVE CHANGES</button>
          </div>
        </form>
      </div>
    </main>

    {{> footer}}
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
