<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
  <meta name="description" content="" />
  <meta name="author" content="" />
  <title>Success - Brand Creator</title>
  <link rel="icon" type="image/x-icon" href="assets/favicon.ico" />
  <script src="https://use.fontawesome.com/releases/v6.3.0/js/all.js" crossorigin="anonymous"></script>
  <link href="https://fonts.googleapis.com/css?family=Varela+Round" rel="stylesheet" />
  <link
    href="https://fonts.googleapis.com/css?family=Nunito:200,200i,300,300i,400,400i,600,600i,700,700i,800,800i,900,900i"
    rel="stylesheet" />
  <link href="/css/styles.css" rel="stylesheet" />
  <link href="/css/global.css" rel="stylesheet" />
</head>

<body class="text-white bg-dark d-flex flex-column min-vh-100">
    {{> navbar}}

  <main class="container px-4 px-lg-5 my-5 pt-5 flex-grow-1 d-flex align-items-center justify-content-center">
    <section class="w-100" style="max-width: 600px;">
      
      <div class="bg-dark border border-success border-opacity-50 rounded-4 shadow-lg p-4 p-md-5 text-center">
        
        <div class="mb-4">
          <div class="d-inline-flex align-items-center justify-content-center rounded-circle bg-success bg-opacity-10 p-4 border border-success border-opacity-25">
            <i class="fas fa-check-circle fa-3x text-success"></i>
          </div>
        </div>

        <h2 class="fw-bold text-uppercase mb-3">It has been completed</h2>
        
        <div class="alert alert-success bg-success bg-opacity-10 border border-success border-opacity-25 text-white rounded-3 py-3 px-4 mb-4">
          {{#message}}
            <p class="m-0 fw-semibold">{{message}}</p>
          {{/message}}
          {{^message}}
            <p class="m-0 fw-semibold">The brand has been created.</p>
          {{/message}}
        </div>

        <p class="text-white-50 small mb-4">
          Click to continue
        </p>

        <div class="d-flex justify-content-center">
          {{#deletedOk}}
            <a href="/" class="btn btn-success px-4 py-2 text-uppercase fw-bold small">
              <i class="fas fa-home me-2"></i> Go to Main
            </a>
          {{/deletedOk}}
          {{^deletedOk}}
            <a href="/detalle/{{id}}" class="btn btn-success px-4 py-2 text-uppercase fw-bold small">
              <i class="fas fa-eye me-2"></i> View Brand Details
            </a>
          {{/deletedOk}}
        </div>

      </div>

    </section>
  </main>

  {{> footer}}

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
