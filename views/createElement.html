<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, shrink-to-fit=no">

  <meta name="description" content="">
  <meta name="author" content="">

  <title>{{pageTitle}}</title>

  <link
    rel="icon"
    type="image/x-icon"
    href="/assets/favicon.ico">

  <link
    href="https://fonts.googleapis.com/css?family=Varela+Round"
    rel="stylesheet">

  <link
    href="https://fonts.googleapis.com/css?family=Nunito:200,300,400,600,700,800,900"
    rel="stylesheet">

  <link href="/css/styles.css" rel="stylesheet">
  <link href="/css/global.css" rel="stylesheet">
  <link href="/css/createEleStyles.css" rel="stylesheet">
</head>

<body class="text-white bg-dark d-flex flex-column min-vh-100">

  {{> navbar}}

  <aside class="container px-4 px-lg-5 mt-5 pt-5">

    <div class="position-relative">

      <img
        src="/uploads/img/coche_fondoOscuro.jpg"
        class="img-fluid rounded-3"
        alt="Car background"
        id="carBg">

      <div class="position-absolute top-50 start-50 translate-middle w-75">

        <div class="text-center text-white">

          <h1
            class="mx-auto my-0 text-uppercase"
            id="titleCreate">
            {{mainTitle}}
          </h1>

          <h4 class="mx-auto my-0">
            {{subtitle}}
          </h4>

        </div>

      </div>

    </div>

  </aside>

  <main class="container px-4 px-lg-5 my-5 flex-grow-1">

    <section>

      <div
        class="container fw-bold text-capitalize bg-dark d-flex border border-secondary justify-content-center align-items-center rounded-4 shadow p-5 text-center"
        id="bannerCreate">

        <h2 class="m-0">
          {{formTitle}}
        </h2>

      </div>

      <div
        class="container bg-dark border border-secondary rounded-4 shadow p-4 p-md-5 mt-5"
        id="formulario">

        <form
          action="{{formAction}}"
          id="formCreator"
          enctype="multipart/form-data"
          method="post">

          <div class="row g-3 mt-1">

            <div class="col-12 col-md-6" id="brandDiv">

              <div class="mb-3">

                <label
                  class="form-label text-white small text-uppercase fw-bold mb-2"
                  for="brand">
                  Brand Name
                </label>

                <input
                  type="text"
                  class="form-control"
                  id="brand"
                  placeholder="Name of brand"
                  name="bName"
                  value="{{name}}"
                  required>

              </div>

            </div>

            <div class="col-12 col-md-6" id="yearDiv">

              <div class="mb-3">

                <label
                  class="form-label text-white small text-uppercase fw-bold mb-2"
                  for="year">
                  Year of Foundation
                </label>

                <input
                  type="date"
                  class="form-control"
                  id="year"
                  name="bYear"
                  value="{{year}}"
                  required>

              </div>

            </div>

          </div>

          <div class="row g-3 mt-1">

            <div class="col-12 col-md-6" id="countryDiv">

              <div class="mb-3">

                <label
                  class="form-label text-white small text-uppercase fw-bold mb-2"
                  for="country">
                  Country
                </label>

                <input
                  type="text"
                  class="form-control"
                  id="country"
                  placeholder="Country"
                  name="bCountry"
                  value="{{country}}"
                  required>

              </div>

            </div>

            <div class="col-12 col-md-6" id="ratingDiv">

              <div class="mb-3 d-flex flex-column justify-content-center">

                <label
                  class="form-label text-white small text-uppercase fw-bold mb-2">
                  Rating
                </label>

                <div
                  class="d-flex flex-wrap align-items-center justify-content-between gap-2 px-3 py-2 bg-black bg-opacity-25 rounded border border-secondary">

                  <div class="form-check m-0">
                    <input
                      class="form-check-input"
                      type="radio"
                      name="stars"
                      id="rate1"
                      value="1"
                      {{#rate1}}checked{{/rate1}}
                      required>

                    <label
                      class="form-check-label text-white fw-bold"
                      for="rate1">
                      1
                    </label>
                  </div>

                  <div class="form-check m-0">
                    <input
                      class="form-check-input"
                      type="radio"
                      name="stars"
                      id="rate2"
                      value="2"
                      {{#rate2}}checked{{/rate2}}>

                    <label
                      class="form-check-label text-white fw-bold"
                      for="rate2">
                      2
                    </label>
                  </div>

                  <div class="form-check m-0">
                    <input
                      class="form-check-input"
                      type="radio"
                      name="stars"
                      id="rate3"
                      value="3"
                      {{#rate3}}checked{{/rate3}}>

                    <label
                      class="form-check-label text-white fw-bold"
                      for="rate3">
                      3
                    </label>
                  </div>

                  <div class="form-check m-0">
                    <input
                      class="form-check-input"
                      type="radio"
                      name="stars"
                      id="rate4"
                      value="4"
                      {{#rate4}}checked{{/rate4}}>

                    <label
                      class="form-check-label text-white fw-bold"
                      for="rate4">
                      4
                    </label>
                  </div>

                  <div class="form-check m-0">
                    <input
                      class="form-check-input"
                      type="radio"
                      name="stars"
                      id="rate5"
                      value="5"
                      {{#rate5}}checked{{/rate5}}>

                    <label
                      class="form-check-label text-white fw-bold"
                      for="rate5">
                      5
                    </label>
                  </div>

                </div>

              </div>

            </div>

          </div>

          <div class="row g-3 mt-1">

            <div class="col-12" id="descriptionDiv">

              <div class="mb-3">

                <label
                  class="form-label text-white small text-uppercase fw-bold mb-2"
                  for="description">
                  Description
                </label>

                <textarea
                  class="form-control"
                  id="description"
                  rows="3"
                  placeholder="Enter brand description"
                  name="bDescription"
                  minlength="10"
                  maxlength="150"
                  required>{{description}}</textarea>

              </div>

            </div>

          </div>

          <div class="row g-3 mt-1">

            <div class="col-12 col-md-6" id="imageDiv">

              <div class="mb-3">

                <label
                  class="form-label text-white small text-uppercase fw-bold mb-2"
                  for="imageFile">
                  Image
                </label>

                {{#isEdit}}
                  {{#img}}
                    <div class="mb-3">

                      <img
                        src="/uploads/logos/{{img}}"
                        alt="Current brand image"
                        width="100"
                        class="rounded border border-secondary">

                      <p class="small text-white mt-2 mb-0">
                        Current image
                      </p>

                    </div>
                  {{/img}}

                  <input
                    type="file"
                    class="form-control"
                    id="imageFile"
                    name="bImage"
                    accept="image/*">
                {{/isEdit}}

                {{^isEdit}}
                  <input
                    type="file"
                    class="form-control"
                    id="imageFile"
                    name="bImage"
                    accept="image/*"
                    required>
                {{/isEdit}}

              </div>

            </div>

            <div class="col-12 col-md-6" id="segmentDiv">

              <div class="mb-3">

                <label
                  class="form-label text-white small text-uppercase fw-bold mb-2"
                  for="segment">
                  Segment
                </label>

                <select
                  class="form-select"
                  name="segment"
                  id="segment"
                  required>

                  <option
                    disabled
                    value=""
                    {{#noSegment}}selected{{/noSegment}}>
                    Choose the segment
                  </option>

                  <option
                    value="lowCost"
                    {{#isLowCost}}selected{{/isLowCost}}>
                    Low-cost
                  </option>

                  <option
                    value="midRange"
                    {{#isMidRange}}selected{{/isMidRange}}>
                    Mid-range
                  </option>

                  <option
                    value="luxury"
                    {{#isLuxury}}selected{{/isLuxury}}>
                    Luxury
                  </option>

                </select>

              </div>

            </div>

          </div>

          <div class="row g-3 mt-3 mb-3">

            <div class="col-12 d-flex justify-content-end gap-2">

              <a
                href="{{cancelUrl}}"
                class="btn btn-secondary"
                id="cancel">
                CANCEL
              </a>

              <button
                type="submit"
                class="btn btn-primary"
                id="send">
                {{submitText}}
              </button>

            </div>

          </div>

        </form>

      </div>

    </section>

  </main>

  {{> footer}}

</body>

</html>
