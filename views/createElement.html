<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
  <meta name="description" content="" />
  <meta name="author" content="" />
  <title>Creator of brands</title>
  <link rel="icon" type="image/x-icon" href="assets/favicon.ico" />
  <!-- Font Awesome icons (free version)-->
  <script src="https://use.fontawesome.com/releases/v6.3.0/js/all.js" crossorigin="anonymous"></script>
  <!-- Google fonts-->
  <link href="https://fonts.googleapis.com/css?family=Varela+Round" rel="stylesheet" />
  <link
    href="https://fonts.googleapis.com/css?family=Nunito:200,200i,300,300i,400,400i,600,600i,700,700i,800,800i,900,900i"
    rel="stylesheet" />
  <!-- Core theme CSS (includes Bootstrap)-->
  <link href="css/styles.css" rel="stylesheet" />
  <link href="css/global.css" rel="stylesheet" />
  <link rel="stylesheet" href="css/createEleStyles.css">
</head>

<body class="text-white bg-dark d-flex flex-column min-vh-100">
  <header>
    <!-- fixed navbar-->
   {{> navbar}} 
   </header>

<!--Aside content-->
  <aside class="container px-4 px-lg-5 mt-5 pt-5">
    <div class="position-relative">
      <img src="assets/img/coche_fondoOscuro.jpg" class="img-fluid rounded-3" alt="" id="carBg">
      <div class="position-absolute top-50 start-50 translate-middle w-75">
        <div class="text-center text-white">
          <h1 class="mx-auto my-0 text-uppercase" id="titleCreate">BRAND CREATOR</h1>
          <h4 class="mx-auto my-0">Create any brand.</h4>
        </div>
      </div>
    </div>
  </aside>

  <!--Main content-->
  <main class="container px-4 px-lg-5 my-5 flex-grow-1">

    <section>
      <div
        class="container fw-bold text-capitalize bg-dark d-flex border border-secondary justify-content-center align-items-center rounded-4 shadow p-5 text-center" id="bannerCreate">
        <h2 class="m-0">Create your brand here</h2>
      </div>
      <div class="container bg-dark border border-secondary rounded-4 shadow p-4 p-md-5 mt-5" id="formulario">

        <form action="" id="formCreator">
       
          <div class="row g-3 mt-1">
            <div class="col-12 col-md-6" id="brandDiv">
              <div class="mb-3">
                <label class="form-label text-white small text-uppercase fw-bold mb-2">Brand Name</label>
                <input type="text" class="form-control" id="brand" placeholder="Name of brand">
              </div>
            </div>
            <div class="col-12 col-md-6" id="yearDiv">
              <div class="mb-3">
                <label class="form-label text-white small text-uppercase fw-bold mb-2">Year of Foundation</label>
                <input type="date" class="form-control" id="year" placeholder="Year of foundation">
              </div>
            </div>
          </div>

          <div class="row g-3 mt-1">
            <div class="col-12 col-md-6" id="countryDiv">
              <div class="mb-3">
                <label class="form-label text-white small text-uppercase fw-bold mb-2">Country</label>
                <input type="text" class="form-control" id="country" placeholder="Country">
              </div>
            </div>
            <div class="col-12 col-md-6" id="ratingDiv">
              <div class="mb-3 d-flex flex-column justify-content-center">
                <label class="form-label text-white small text-uppercase fw-bold mb-2">Rating</label>
                <div class="d-flex flex-wrap align-items-center justify-content-between gap-2 px-3 py-2 bg-black bg-opacity-25 rounded border border-secondary">
                  <div class="form-check m-0">
                    <input class="form-check-input" type="radio" name="estrellas" id="rate1" value="1">
                    <label class="form-check-label text-white fw-bold" for="rate1">1</label>
                  </div>
                  <div class="form-check m-0">
                    <input class="form-check-input" type="radio" name="estrellas" id="rate2" value="2">
                    <label class="form-check-label text-white fw-bold" for="rate2">2</label>
                  </div>
                  <div class="form-check m-0">
                    <input class="form-check-input" type="radio" name="estrellas" id="rate3" value="3">
                    <label class="form-check-label text-white fw-bold" for="rate3">3</label>
                  </div>
                  <div class="form-check m-0">
                    <input class="form-check-input" type="radio" name="estrellas" id="rate4" value="4">
                    <label class="form-check-label text-white fw-bold" for="rate4">4</label>
                  </div>
                  <div class="form-check m-0">
                    <input class="form-check-input" type="radio" name="estrellas" id="rate5" value="5">
                    <label class="form-check-label text-white fw-bold" for="rate5">5</label>
                  </div>
                </div>
              </div>
            </div>
          </div>

         
          <div class="row g-3 mt-1">
            <div class="col-12 col-md-6" id="imageDiv">
              <div class="mb-3">
                <label class="form-label text-white small text-uppercase fw-bold mb-2">Image</label>
                <input type="file" class="form-control" id="imageFile">
              </div>
            </div>
            <div class="col-12 col-md-6" id="segmentDiv">
              <div class="mb-3">
                <label class="form-label text-white small text-uppercase fw-bold mb-2">Segment</label>
                <select class="form-select" id="segment">
                  <option selected disabled>Choose the segment</option>
                  <option value="lowCost">LOW-COST</option>
                  <option value="midRange">Mid-range</option>
                  <option value="luxury">Luxury</option>
                </select>
              </div>
            </div>
          </div>

      
          <div class="row g-3 mt-3 mb-3">
            <div class="col-12 d-flex justify-content-end gap-2">
              <a href="index.html" class="btn btn-secondary" id="cancel">CANCEL</a>
              <button type="submit" class="btn btn-primary" id="send">CREATE</button>
            </div>
          </div>
        </form>

      </div>
    </section>

  </main>


<!-- footer-->
   {{> footer}}

  
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
